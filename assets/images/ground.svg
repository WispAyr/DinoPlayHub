<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 200">
  <defs>
    <pattern id="grass" width="60" height="200" patternUnits="userSpaceOnUse">
      <rect width="60" height="200" fill="#689F38"/>
      <!-- Grass tufts -->
      <path d="M 0 30 L 10 10 L 20 30 Z" fill="#8BC34A"/>
      <path d="M 20 30 L 35 5 L 45 30 Z" fill="#7CB342"/>
      <rect y="30" width="60" height="170" fill="#795548"/> <!-- dirt -->
      <rect y="30" width="60" height="10" fill="#558B2F"/> <!-- edge -->
      <circle cx="20" cy="80" r="5" fill="#5D4037"/>
      <circle cx="45" cy="120" r="8" fill="#5D4037"/>
      <circle cx="15" cy="160" r="4" fill="#5D4037"/>
    </pattern>
  </defs>
  <rect width="1080" height="200" fill="url(#grass)"/>
</svg>
