<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- Flipped horizontally to face right -->
  <g transform="scale(-1, 1) translate(-200, 0)">
    <defs>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#81C784"/>
        <stop offset="100%" stop-color="#388E3C"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
      </filter>
    </defs>
    <!-- Wing Back -->
    <path d="M 120 70 Q 150 20 180 50 Q 140 80 120 70" fill="#2E7D32" stroke="#1B5E20" stroke-width="4"/>
    <!-- Body/Head -->
    <path d="M 40 80 Q 20 60 10 70 Q 30 90 40 80 Z" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="4"/> <!-- Beak back -->
    <ellipse cx="80" cy="75" rx="40" ry="30" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="5" filter="url(#shadow)"/>
    <path d="M 70 50 L 50 20 L 85 46 Z" fill="url(#bodyGrad)" stroke="#1B5E20" stroke-width="4"/> <!-- Crest -->
    <!-- Long Beak -->
    <path d="M 45 70 Q 10 55 5 65 Q 35 85 45 80" fill="#FFB74D" stroke="#E65100" stroke-width="4"/> 
    <!-- Eye -->
    <circle cx="65" cy="65" r="8" fill="white" stroke="#1B5E20" stroke-width="3"/>
    <circle cx="63" cy="65" r="3" fill="black"/>
    <!-- Wing Front -->
    <path d="M 110 80 Q 160 30 190 70 Q 140 100 110 80 Z" fill="#4CAF50" stroke="#1B5E20" stroke-width="4" filter="url(#shadow)"/>
  </g>
</svg>
